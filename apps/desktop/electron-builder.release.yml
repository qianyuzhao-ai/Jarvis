extends: ./electron-builder.yml
directories:
  output: ../../release/github-${version}
mac:
  artifactName: Jarvis-${version}-macos-${arch}-unsigned.${ext}
  identity: null
  hardenedRuntime: false
  notarize: false
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
win:
  artifactName: Jarvis-${version}-windows-${arch}-unsigned-setup.${ext}
  signExecutable: false
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
