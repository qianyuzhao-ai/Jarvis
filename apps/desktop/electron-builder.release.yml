extends: ./electron-builder.yml
directories:
  output: ../../release/github-${version}
publish:
  provider: github
  owner: qianyuzhao-ai
  repo: Jarvis
  releaseType: prerelease
mac:
  artifactName: Jarvis-${version}-macos-${arch}.${ext}
  type: distribution
  forceCodeSigning: true
  hardenedRuntime: true
  notarize: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
win:
  artifactName: Jarvis-${version}-windows-${arch}-unsigned-setup.${ext}
  signExecutable: false
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
