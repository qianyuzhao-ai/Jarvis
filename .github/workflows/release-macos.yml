name: Package macOS Apple Silicon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build unsigned arm64 package
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          cache: true
      - name: Verify release tag and main branch
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node apps/desktop/scripts/verify-release.mjs "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:smoke
      - name: Build unsigned DMG and ZIP
        working-directory: apps/desktop
        run: pnpm exec electron-builder --mac --arm64 --publish never --config electron-builder.release.yml
      - name: Verify package architecture
        run: |
          app="release/github/mac-arm64/Jarvis.app"
          test -d "$app"
          test "$(lipo -archs "$app/Contents/MacOS/Jarvis")" = arm64
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          test -f "release/github/Jarvis-${version}-macos-arm64-unsigned.dmg"
          test -f "release/github/Jarvis-${version}-macos-arm64-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-macos-arm64-unsigned-${{ github.run_id }}
          path: |
            release/github/*.dmg
            release/github/*.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/github/*.dmg release/github/*.zip \
            --verify-tag --generate-notes --prerelease --title "$GITHUB_REF_NAME (unsigned, Apple Silicon)"
