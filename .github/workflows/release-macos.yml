name: Package macOS Apple Silicon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish, for example v0.1.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: package-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Build unsigned arm64 package
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          cache: true
      - name: Verify release tag and main branch
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor HEAD origin/main
          node apps/desktop/scripts/verify-release.mjs "$RELEASE_TAG"
      - name: Refuse duplicate GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release already exists for $RELEASE_TAG"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:smoke
      - name: Build unsigned DMG and ZIP
        working-directory: apps/desktop
        run: pnpm exec electron-builder --mac --arm64 --publish never --config electron-builder.release.yml
      - name: Verify package architecture
        run: |
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          release_dir="release/github-${version}"
          app="$release_dir/mac-arm64/Jarvis.app"
          test -d "$app"
          test "$(lipo -archs "$app/Contents/MacOS/Jarvis")" = arm64
          test -f "$release_dir/Jarvis-${version}-macos-arm64-unsigned.dmg"
          test -f "$release_dir/Jarvis-${version}-macos-arm64-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-macos-arm64-unsigned-${{ github.run_id }}
          path: |
            release/github-*/*.dmg
            release/github-*/*.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/github-*/*.dmg release/github-*/*.zip \
            --verify-tag --generate-notes --prerelease --title "$RELEASE_TAG (unsigned, Apple Silicon)"
