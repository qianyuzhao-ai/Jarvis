name: Package macOS and Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish, for example v0.1.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            runner: macos-15-intel
          - platform: windows
            arch: x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Preserve LF line endings on Windows
        if: matrix.platform == 'windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          cache: true
      - name: Verify release tag and main branch
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor HEAD origin/main
          node apps/desktop/scripts/verify-release.mjs "$RELEASE_TAG"
      - name: Refuse duplicate GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release already exists for $RELEASE_TAG"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Build signed and notarized DMG and ZIP
        if: matrix.platform == 'macos'
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo '::error::APPLE_TEAM_ID must contain 10 uppercase letters or digits'
            exit 1
          fi
          pnpm exec electron-builder --mac --arm64 --publish never --config electron-builder.release.yml
      - name: Load macOS verification tools from workflow commit
        if: matrix.platform == 'macos'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            apps/desktop/scripts/verify-macos-release.sh
            apps/desktop/scripts/apple-network-retry.sh
            apps/desktop/scripts/apple-network-retry.test.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Test Apple network retry policy
        if: matrix.platform == 'macos'
        run: bash .release-tools/apps/desktop/scripts/apple-network-retry.test.sh
      - name: Verify macOS package
        if: matrix.platform == 'macos'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .release-tools/apps/desktop/scripts/verify-macos-release.sh
      - name: Build unsigned Windows installer
        if: matrix.platform == 'windows'
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win --x64 --publish never --config electron-builder.release.yml
      - name: Verify Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          $releaseDir = "release/github-$version"
          $app = "$releaseDir/win-unpacked/Jarvis.exe"
          $installer = "$releaseDir/Jarvis-$version-windows-x64-unsigned-setup.exe"
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $app))
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x4550 -or
              [BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) {
            throw 'Application is not a Windows x64 PE executable'
          }
          $info = (Get-Item $app).VersionInfo
          $actualVersion = "$($info.FileMajorPart).$($info.FileMinorPart).$($info.FileBuildPart)"
          Write-Host "File version: $($info.FileVersion); product version: $($info.ProductVersion)"
          if ($actualVersion -ne $version) {
            throw "Application version $actualVersion does not match release $version"
          }
          foreach ($file in @($app, $installer)) {
            if ((Get-Item $file).Length -eq 0) { throw "Empty package: $file" }
            if ((Get-AuthenticodeSignature $file).Status -ne 'NotSigned') {
              throw "Expected unsigned file: $file"
            }
          }
      - name: Verify packaged dependencies and startup
        run: |
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          node --test apps/desktop/scripts/verify-packaged-dependencies.test.mjs
          node apps/desktop/scripts/verify-packaged-startup.mjs "release/github-${version}"
      - name: Verify update metadata
        run: |
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          node apps/desktop/scripts/verify-update-metadata.mjs "release/github-${version}" "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            release/github-*/*.dmg
            release/github-*/*.zip
            release/github-*/*-setup.exe
            release/github-*/*.yml
            !release/github-*/builder-*.yml
            release/github-*/*.blockmap
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish combined GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: Jarvis-*-${{ github.run_id }}
          path: release-assets
          merge-multiple: true
      - name: Verify assets and publish one Release
        shell: bash
        run: |
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          assets=(
            "release-assets/github-${version}/Jarvis-${version}-macos-arm64.dmg"
            "release-assets/github-${version}/Jarvis-${version}-macos-arm64.zip"
            "release-assets/github-${version}/Jarvis-${version}-windows-x64-unsigned-setup.exe"
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          shopt -s nullglob
          metadata=(release-assets/github-${version}/*.yml)
          mac_metadata=(release-assets/github-${version}/*-mac.yml)
          test "${#metadata[@]}" -ge 2
          test "${#mac_metadata[@]}" -ge 1
          blockmaps=(release-assets/github-${version}/*.blockmap)
          for asset in "${metadata[@]}" "${blockmaps[@]}"; do
            test -s "$asset"
          done
          assets+=("${metadata[@]}" "${blockmaps[@]}")
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release already exists for $RELEASE_TAG"
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag --generate-notes --prerelease \
            --title "$RELEASE_TAG (macOS signed & notarized, Windows unsigned)"
